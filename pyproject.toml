[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-msg"
version = "0.1.1"
description = "Local, journaled messages between Claude Code and Codex sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [{name = "nsssayom"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
]

[project.scripts]
agent-msg = "agent_msg.cli:main"

[project.urls]
Repository = "https://github.com/nsssayom/agent-msg"
Issues = "https://github.com/nsssayom/agent-msg/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_msg = ["LICENSE", "static/*", "skill/SKILL.md", "skill/agents/*.yaml", "plugin_assets/*"]
